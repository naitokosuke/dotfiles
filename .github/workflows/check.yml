# Runs on every pull request: the flake check on macOS, and the docs checks.
name: check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    # The flake only has aarch64-darwin outputs, and building them needs a
    # machine of that platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3

      # Evaluates and builds every host, every custom package and the
      # formatting check (see `checks` in flake.nix).
      - run: nix flake check --print-build-logs --option allow-import-from-derivation false

  docs:
    # Lints, type-checks and tests the docs site, including how it reads the
    # walkthroughs out of the source comments (docs/src/colocated.ts).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: docs
          node-version: "26"
          cache: true

      - run: vp check
      - run: vp test
