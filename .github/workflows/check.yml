# Runs `nix flake check` on every pull request: every host, every custom
# package and the formatting check (see `checks` in flake.nix). The flake only
# has aarch64-darwin outputs, so building them needs a macOS runner.
name: check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3

      - run: nix flake check --print-build-logs --option allow-import-from-derivation false
