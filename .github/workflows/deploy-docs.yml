name: deploy-docs

on:
  workflow_dispatch:
  # No paths filter: the site globs *.nix, README.md, workflows, etc. from
  # across the repository at build time, so almost any change to main alters
  # what it renders.
  push:
    branches: [main]

permissions:
  contents: read

# Queue deploys instead of cancelling one mid-upload; only the newest pending
# run is kept, so a burst of merges still ends on the latest main.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          working-directory: docs
          node-version: "26"
          cache: true

      # .void/project.json is gitignored, so the project is named explicitly.
      # Void 1.x has no default platform and requires VOID_API_URL with VOID_TOKEN.
      # It also only deploys to a saved connection, which a fresh runner lacks.
      - name: Deploy
        run: |
          vp exec void connect "$VOID_API_URL" --no-login
          vp run deploy
        env:
          VOID_API_URL: https://api.void.cloud
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}
          VOID_PROJECT: naitokosuke-dotfiles
