name: deploy-docs

on:
  workflow_dispatch:
  # No paths filter: the site globs *.nix, README.md, workflows, etc. from
  # across the repository at build time, so almost any change to main alters
  # what it renders.
  push:
    branches: [main]

# id-token: write lets `void deploy` mint a GitHub OIDC token and exchange it
# for a short-lived deploy token, so no long-lived VOID_TOKEN secret is stored.
# The repository is authorized with `void github connect`, which names this
# workflow file as the only one allowed to deploy.
permissions:
  contents: read
  id-token: write

# Queue deploys instead of cancelling one mid-upload; only the newest pending
# run is kept, so a burst of merges still ends on the latest main.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: docs
          node-version: "26"
          cache: true

      # .void/project.json is gitignored, so the project is named explicitly.
      # Void 1.x has no default platform, so VOID_API_URL is set explicitly.
      # It also only deploys to a saved connection, which a fresh runner lacks.
      - name: Deploy
        run: |
          vp exec void connect "$VOID_API_URL" --no-login
          vp run deploy
        env:
          VOID_API_URL: https://api.void.cloud
          VOID_PROJECT: naitokosuke-dotfiles
