name: nvfetcher

on:
  workflow_dispatch:
    inputs:
      skip-cooldown:
        description: Propose releases regardless of their age (for urgent fixes)
        type: boolean
        default: false
  schedule:
    # Daily at 08:00 JST
    - cron: "0 23 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # macOS, so the result can be built before it is proposed (see the check
    # step below).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3

      # The pinned hash only records what was fetched, so a hijacked release
      # would be pinned as it is. Releases younger than the cooldown are
      # skipped, which leaves time for one to be noticed upstream (#584).
      # The selection itself is in .github/nvfetcher-cooldown.nix.
      - name: Hold back releases younger than the cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLDOWN_DAYS: ${{ inputs.skip-cooldown && '0' || '3' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -v"-${COOLDOWN_DAYS}d" +%Y-%m-%dT%H:%M:%SZ)
          echo "COOLDOWN_CUTOFF=$cutoff" >> "$GITHUB_ENV"
          releases=$RUNNER_TEMP/releases
          mkdir -p "$releases"
          nix eval --raw --impure --expr '(import ./.github/nvfetcher-cooldown.nix { }).repos' |
            while read -r name repo; do
              gh api "repos/$repo/releases?per_page=100" > "$releases/$name.json"
            done
          nix eval --raw --impure --expr \
            "(import ./.github/nvfetcher-cooldown.nix { cutoff = \"$cutoff\"; releases = \"$releases\"; }).sed" |
            tee "$RUNNER_TEMP/pins.sed"
          sed -f "$RUNNER_TEMP/pins.sed" nvfetcher.toml > "$RUNNER_TEMP/nvfetcher.toml"

      # nvfetcher's `extract` evaluates `import <nixpkgs>`, which a runner has
      # no channel for, so the nixpkgs this flake locks is put on NIX_PATH.
      - name: Run nvfetcher
        run: |
          NIX_PATH="nixpkgs=$(nix eval --raw --inputs-from . nixpkgs#path)"
          export NIX_PATH
          nix run --inputs-from . nixpkgs#nvfetcher -- -c "$RUNNER_TEMP/nvfetcher.toml" -o pkgs/_sources

      # The vite-plus launcher that nvfetcher pins and the JavaScript toolchain
      # in pkgs/vite-plus-runtime are two halves of one release, and the
      # derivation refuses to build if they disagree (issue #413). nvfetcher
      # only knows about the launcher, so the lockfile is brought along here
      # rather than left as a manual step after every bump.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: Sync the vite-plus runtime lockfile
        run: |
          read_json() {
            nix eval --raw --impure --expr "(builtins.fromJSON (builtins.readFile $1)).$2"
          }
          version=$(read_json ./pkgs/_sources/generated.json vite-plus.version)
          # The lockfile only moves together with the launcher.
          if [ "$(read_json ./pkgs/vite-plus-runtime/package.json dependencies.vite-plus)" = "$version" ]; then
            exit 0
          fi
          cd pkgs/vite-plus-runtime
          npm pkg set "dependencies.vite-plus=$version"
          # vite-plus lists oxlint, oxfmt and vitest as peers of itself, so a
          # bump rearranges a graph npm cannot migrate in place: it holds on to
          # the tree the committed lockfile describes and gives up with
          # ERESOLVE. The lockfile is regenerated wholesale for the pinned
          # version either way, so the old one goes first. `--before` applies
          # the same cooldown to every dependency it resolves.
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --before="$COOLDOWN_CUTOFF"

      # A pull request opened with GITHUB_TOKEN does not trigger the check
      # workflow, so the same check runs here: a bump that does not evaluate
      # or build fails this job instead of becoming a pull request.
      - name: Check the flake
        run: |
          git add --intent-to-add pkgs
          nix flake check --print-build-logs --option allow-import-from-derivation false

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.2
        with:
          branch: nvfetcher-update
          commit-message: "chore: update nvfetcher sources"
          title: "chore: update nvfetcher sources"
          body: |
            Automated update of `pkgs/_sources/generated.nix` by the nvfetcher workflow.
          add-paths: |
            pkgs/_sources/
            pkgs/vite-plus-runtime/
          delete-branch: true
