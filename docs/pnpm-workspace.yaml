allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  # Security floors for transitive deps whose parents pin vulnerable versions
  # (miniflare/wrangler pin ws/undici exactly; sharp 0.35 is outside miniflare's ^0.34.5)
  sharp: ^0.35.0
  ws: ^8.21.0
  undici: ^7.29.1
minimumReleaseAgeExclude:
  - "@void/deploy-cloudflare@1.1.11"
  - "@void/deploy-core@1.1.11"
  - "@void/edge@1.1.11"
  - "@void/isr@1.1.11"
  - "@void/platform@1.1.11"
  - void@1.1.11
  - "@void/vue@1.1.11"
overrides:
  esbuild: ">=0.28.1"
  sharp: "catalog:"
  ws: "catalog:"
  undici: "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
