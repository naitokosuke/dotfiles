allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  # Security floors for transitive deps whose parents pin vulnerable versions
  # (miniflare/wrangler pin ws/undici exactly; sharp 0.35 is outside miniflare's ^0.34.5)
  sharp: ^0.35.0
  ws: ^8.21.0
  undici: ^7.30.1
  postal-mime: ^4.0.8
  zod: ^4.6.6
overrides:
  esbuild: ">=0.28.1"
  sharp: "catalog:"
  ws: "catalog:"
  undici: "catalog:"
  postal-mime: "catalog:"
  zod: "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
